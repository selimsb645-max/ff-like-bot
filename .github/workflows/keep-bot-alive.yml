name: FF Like Bot (24/7)
on:
  workflow_dispatch:
  schedule:
    - cron: '3 * * * *'
# OWNER 2026-11-19: the Redispatch step posts with secrets.GITHUB_TOKEN. Without
# actions: write that POST is refused silently (curl without -f), so a single
# failed proxy step stopped the 24/7 chain for hours. This grants exactly what
# the dispatch needs and nothing more.
permissions:
  actions: write
  contents: write

concurrency:
  group: ff-bot
  cancel-in-progress: false
jobs:
  run-bot:
    env:
      # Owner 2026-11-20: @NAI_AccessBot unreachable (Base44 quota 402) - gate off for
      # our own runs. Delete this line to re-arm the licence/device gate.
      FF_SKIP_ACCESS: "1"
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      # OWNER 2026-11-19: "আগে বট চালু করো". The phone being offline must not take the
      # whole bot down - it only removes the BD exit, so likes/mints pause while /start,
      # profile, guild and history keep working. Without continue-on-error this step
      # failed the job and 'Run bot' was skipped, which is why the bot was dead all day.
      - name: Phone BD proxy (Tailscale)
        continue-on-error: true
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          PHONE_PROXY_IP: ${{ secrets.PHONE_PROXY_IP }}
          TS_HOSTNAME: ff-gh-bot
        run: |
          if bash ci/phone_proxy_setup.sh; then
            echo "phone proxy ready: $PHONE_PROXY_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::phone proxy unavailable - starting the bot WITHOUT a BD exit (likes/mints will wait)"
          fi
      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BD_CREDS_B64: ${{ secrets.BD_CREDS_B64 }}
          GITHUB_USAGE_TOKEN: ${{ secrets.USAGE_PAT }}
          PHONE_PROXY_URL: socks5://${{ secrets.PHONE_PROXY_IP }}:1080
        run: |
          chmod +x run.sh
          ./run.sh
      - name: Redispatch
        if: always()
        run: |
          sleep 60
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/actions/workflows/keep-bot-alive.yml/dispatches -d '{"ref":"main"}'
