name: FF Like Bot (24/7)
on:
  workflow_dispatch:
  schedule:
    - cron: '3 * * * *'
concurrency:
  group: ff-bot
  cancel-in-progress: false
jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BD_CREDS_B64: ${{ secrets.BD_CREDS_B64 }}
          GITHUB_USAGE_TOKEN: ${{ secrets.USAGE_PAT }}
        run: |
          chmod +x run.sh
          ./run.sh
      - name: Redispatch
        if: always()
        run: |
          sleep 60
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/actions/workflows/keep-bot-alive.yml/dispatches -d '{"ref":"main"}'
