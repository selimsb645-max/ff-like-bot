name: FF Like Bot (24/7)
on:
  workflow_dispatch:
  schedule:
    - cron: '3 * * * *'
concurrency:
  group: ff-bot
  cancel-in-progress: false
jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Tailscale (phone-as-BD-proxy)
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          PHONE_PROXY_IP: ${{ secrets.PHONE_PROXY_IP }}
        run: |
          if [ -z "$TS_AUTHKEY" ]; then
            echo "no TAILSCALE_AUTHKEY — skipping phone proxy"
            exit 0
          fi
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscaled > /tmp/tailscaled.log 2>&1 &
          sleep 4
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="ff-gh-runner" --accept-routes --reset
          echo "--- tailnet peers ---"
          sudo tailscale status || true
          # Auto-discover the phone if PHONE_PROXY_IP is not set
          if [ -z "$PHONE_PROXY_IP" ]; then
            PHONE_PROXY_IP=$(sudo tailscale status --json | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          peers=[p for p in (d.get('Peer') or {}).values()]
          cands=[]
          for p in peers:
              ips=[a for a in (p.get('TailscaleIPs') or []) if a.count('.')==3]
              if p.get('HostName','').lower().startswith('ff-gh-runner'): continue
              if ips: cands.append((p.get('HostName'), p.get('OS'), ips[0]))
          for h,os_,ip in cands: print(h, os_, ip, file=sys.stderr)
          print(cands[0][2] if cands else '')
          " 2>/tmp/peers.txt) || true
            echo "auto-discovered phone IP: ${PHONE_PROXY_IP:-<none>}"
          fi
          echo "PHONE_PROXY_IP=$PHONE_PROXY_IP" >> "$GITHUB_ENV"
          if [ -n "$PHONE_PROXY_IP" ]; then
            python3 - "$PHONE_PROXY_IP" <<'PYEOF'
          import sys, httpx, os
          ip = sys.argv[1]
          u = f"socks5://{ip}:1080"
          try:
              j = httpx.get("https://ipinfo.io/json", proxy=u, timeout=25).json()
              print(f"PHONE PROXY OK | exit IP: {j.get('ip')} | country: {j.get('country')} | org: {j.get('org')}")
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write(f"PHONE_PROXY_URL={u}\n")
              if j.get("country") != "BD":
                  print("WARNING: exit is not BD — check mobile data / exit node")
          except Exception as e:
              print("PHONE PROXY UNREACHABLE at", u, "->", str(e)[:160])
          PYEOF
          fi
      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BD_CREDS_B64: ${{ secrets.BD_CREDS_B64 }}
          GITHUB_USAGE_TOKEN: ${{ secrets.USAGE_PAT }}
          PHONE_PROXY_URL: socks5://${{ secrets.PHONE_PROXY_IP }}:1080
        run: |
          chmod +x run.sh
          ./run.sh
      - name: Redispatch
        if: always()
        run: |
          sleep 60
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/actions/workflows/keep-bot-alive.yml/dispatches -d '{"ref":"main"}'
