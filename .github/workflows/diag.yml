name: like-diagnostic
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q httpx pysocks protobuf
      - run: python3 scripts_diag_likes.py
        env:
          BD_PROXY_URL: ${{ secrets.BD_PROXY_URL }}
