name: Glory Farm (guild account)
on:
  workflow_dispatch:
concurrency:
  group: glory-farm
  cancel-in-progress: false
jobs:
  farm:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r requirements.txt socksio
      - name: Join Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscaled > /tmp/tailscaled.log 2>&1 &
          sleep 5
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="ff-farm" --accept-routes --reset || true
      - name: Farm glory cycles
        env:
          GUEST_CREDS_JSON: ${{ secrets.GUEST_CREDS_JSON }}
          PHONE_PROXY_IP: ${{ secrets.PHONE_PROXY_IP }}
        run: |
          export GUEST_PW="$(python3 -c "import json,os;print(json.loads(os.environ['GUEST_CREDS_JSON'])['pw'])")"
          export UID_FF="$(python3 -c "import json,os;print(json.loads(os.environ['GUEST_CREDS_JSON'])['uid'])")"
          python3 -c "import json,pathlib;p=pathlib.Path('level_config.json');c=json.loads(p.read_text());c.update({'enabled':True,'auto_mint':0,'farm':True,'workers':1});p.write_text(json.dumps(c,indent=1));print('config ok')"
          if timeout 10 bash -c "</dev/tcp/$PHONE_PROXY_IP/1080" 2>/dev/null; then
            export BD_PROXY_URL="socks5://$PHONE_PROXY_IP:1080"
            export PHONE_OK=1
            echo "proxy: phone BD reachable"
          else
            echo "proxy: phone unreachable, running direct"
          fi
          for attempt in 1 2 3; do
            echo "=== attempt $attempt at $(date -u +%H:%M:%S) ==="
            timeout 2400 python3 -u -m levelbot.run_level --uid "$UID_FF" --cycles 12 > /tmp/run_$attempt.log 2>&1 || true
            tail -20 /tmp/run_$attempt.log
            if grep -q "TCP CONNECTED" /tmp/run_$attempt.log; then echo "CONNECTED on attempt $attempt"; fi
            if grep -q "DONE cycles" /tmp/run_$attempt.log; then echo "cycles completed"; break; fi
            sleep 40
          done
