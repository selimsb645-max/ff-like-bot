name: Glory Farm (guild account)
on:
  workflow_dispatch:
  schedule:
    - cron: '15 */3 * * *'
concurrency:
  group: glory-farm
  cancel-in-progress: false
jobs:
  farm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r requirements.txt socksio
      - name: Farm glory cycles
        env:
          GUEST_CREDS_JSON: ${{ secrets.GUEST_CREDS_JSON }}
        run: |
          export GUEST_PW="$(python3 -c "import json,os;print(json.loads(os.environ['GUEST_CREDS_JSON'])['pw'])")"
          export UID_FF="$(python3 -c "import json,os;print(json.loads(os.environ['GUEST_CREDS_JSON'])['uid'])")"
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("level_config.json")
          cfg = json.loads(p.read_text())
          cfg.update({"enabled": True, "auto_mint": 0, "farm": True, "workers": 1})
          p.write_text(json.dumps(cfg, indent=1))
          print("config: farm on, no mint", flush=True)
          PY
          echo "farming uid $UID_FF with 30 cycles (direct, no proxy)"
          timeout 6600 python3 -u -m levelbot.run_level --uid "$UID_FF" --cycles 30 2>&1 | tail -80
