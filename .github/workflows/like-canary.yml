name: Like canary

# একটাই প্রশ্নের উত্তর: ফোনের BD আইপি দিয়ে পাঠানো লাইক সত্যিই কাউন্টার নাড়ায় কি না।
# LikeProfile সবসময় 200 দেয়, তাই "sent" প্রমাণ নয় — কাউন্টার আগে/পরে পড়া হয়।
on:
  workflow_dispatch:
    inputs:
      uid:
        description: "target UID"
        default: "9078648985"
      count:
        description: "how many likes to attempt"
        default: "5"

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "httpx[socks]" aiohttp_socks
      - name: Phone BD proxy (Tailscale)
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          PHONE_PROXY_IP: ${{ secrets.PHONE_PROXY_IP }}
          TS_HOSTNAME: ff-gh-canary
        run: bash ci/phone_proxy_setup.sh
      - name: Canary
        env:
          PHONE_PROXY_URL: ${{ env.PHONE_PROXY_URL }}
          BD_CREDS_B64: ${{ secrets.BD_CREDS_B64 }}
          GUEST_CREDS_B64: ${{ secrets.GUEST_CREDS_B64 }}
          GUEST_CREDS_JSON: ${{ secrets.GUEST_CREDS_JSON }}
        run: |
          echo "proxy: ${PHONE_PROXY_URL:-none}"
          python3 like_canary.py --uid "${{ github.event.inputs.uid || '9078648985' }}" \
                                 --count "${{ github.event.inputs.count || '5' }}"
