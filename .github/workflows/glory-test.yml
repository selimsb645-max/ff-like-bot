name: Glory Engine Test (phone proxy)
on:
  workflow_dispatch:
concurrency:
  group: glory-test
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r requirements.txt socksio
      - name: Join Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscaled > /tmp/tailscaled.log 2>&1 &
          sleep 5
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="ff-glory-test" --accept-routes --reset
      - name: Modern MajorLogin test
        env:
          PHONE_PROXY_IP: ${{ secrets.PHONE_PROXY_IP }}
        run: |
          python3 - <<'PY'
          import os, json, httpx
          px = "socks5://" + os.environ["PHONE_PROXY_IP"] + ":1080"
          import ff_bd_api as api, ff_majorlogin
          pool = json.load(open("guests_manager/registered_pool.json"))
          print("pool:", len(pool), flush=True)
          for acc in pool[:3]:
              uid, pw = acc["uid"], acc["pw"]
              # guest grant is an OAuth call: direct is fine and less flaky
              pair = api.guest_grant(uid, pw)
              print(f"{uid} grant:", bool(pair), flush=True)
              if not pair:
                  continue
              at, oid = pair
              _post = httpx.post
              httpx.post = lambda *a, **kw: _post(*a, **{**kw, "proxy": px})
              try:
                  ip = httpx.get("https://ipinfo.io/json", proxy=px, timeout=20).json().get("ip")
              except Exception:
                  ip = "223.191.51.89"
              ml = ff_majorlogin.major_login(uid, oid, at, ip)
              print(f"{uid} major_login:", ("OK jwt=" + str(len(ml["jwt"]))) if ml else "None", "| ip:", ip, flush=True)
              if ml:
                  print("   key:", bool(ml.get("key")), "iv:", bool(ml.get("iv")), "url:", str(ml.get("url"))[:50], "region:", ml.get("region"), flush=True)
                  break
          PY
      - name: Run glory engine through phone proxy
        if: false
        env:
          BD_CREDS_B64: ${{ secrets.BD_CREDS_B64 }}
          PHONE_PROXY_IP: ${{ secrets.PHONE_PROXY_IP }}
        run: |
          [ -n "$BD_CREDS_B64" ] && echo "$BD_CREDS_B64" | base64 -d > bd_creds.txt || true
          export BD_PROXY_URL="socks5://$PHONE_PROXY_IP:1080"
          export PHONE_OK=1
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("level_config.json")
          cfg = json.loads(p.read_text()) if p.exists() else {}
          cfg.update({"enabled": True, "accounts": 1, "cycles": 1, "auto_mint": 0, "farm": True, "workers": 1})
          p.write_text(json.dumps(cfg, indent=1))
          print("test config ready")
          PY
          timeout 900 python3 -u -m levelbot.run_level --all 1 --cycles 1 2>&1 | tail -100
