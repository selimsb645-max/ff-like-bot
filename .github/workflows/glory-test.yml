name: Glory Engine Test (phone proxy)
on:
  workflow_dispatch:
concurrency:
  group: glory-test
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r requirements.txt socksio
      - name: Token field diagnosis
        env:
          GUEST_CREDS_JSON: ${{ secrets.GUEST_CREDS_JSON }}
        run: |
          python3 - <<'PY'
          import os, json, time, asyncio
          import ff_bd_api as api
          from levelbot import run_level as rl
          pool = json.load(open("guests_manager/registered_pool.json"))
          pool.sort(key=lambda r: int(r["uid"]) if str(r["uid"]).isdigit() else 0, reverse=True)
          acc = pool[0]
          print("uid", acc["uid"], flush=True)
          login = rl.raw_login(acc["uid"], acc["pw"])
          print("login:", bool(login), flush=True)
          if login:
              now = int(time.time())
              print("ts field      :", login["ts"], "| now:", now, "| diff(s):", now - login["ts"], flush=True)
              print("account_id    :", login["account_id"], "| uid:", acc["uid"], "| equal:", str(login["account_id"]) == str(acc["uid"]), flush=True)
              print("key/iv types  :", type(login["key"]).__name__, len(login["key"]), type(login["iv"]).__name__, len(login["iv"]), flush=True)
              tok = asyncio.run(rl.build_conn_token(login))
              print("token len     :", len(tok), "| head:", tok[:60], flush=True)
              print("token structure -> prefix 0115 | hdr | uid_hex | ts_hex | len | enc", flush=True)
              uid_hex = hex(login["account_id"])[2:]
              print("uid_hex       :", uid_hex, len(uid_hex), flush=True)
              print("ts_hex        :", hex(login["ts"])[2:], flush=True)
          PY
