name: Glory Engine Test (phone proxy)
on:
  workflow_dispatch:
concurrency:
  group: glory-test
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r requirements.txt socksio
      - name: Join Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscaled > /tmp/tailscaled.log 2>&1 &
          sleep 5
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="ff-glory-test" --accept-routes --reset
      - name: MajorLogin JSON variants probe
        env:
          PHONE_PROXY_IP: ${{ secrets.PHONE_PROXY_IP }}
        run: |
          export BD_PROXY_URL="socks5://$PHONE_PROXY_IP:1080"
          python3 - <<'PY'
          import os, json, httpx, re
          import ff_bd_api as api
          px=os.environ["BD_PROXY_URL"]
          acc=json.load(open("guests_manager/registered_pool.json"))[0]
          pair=api.guest_grant(acc["uid"], acc["pw"])
          print("grant:", bool(pair), flush=True)
          if not pair: raise SystemExit
          at, oid = pair
          variants=[
            ("ggblueshark-json-BD","https://loginbp.ggblueshark.com/MajorLogin","BD"),
            ("ggblueshark-json-bd","https://loginbp.ggblueshark.com/MajorLogin","bd"),
            ("ggpolarbear-json-BD","https://loginbp.ggpolarbear.com/MajorLogin","BD"),
            ("ppmainecoon-json-BD","https://loginbp.ppmainecoonghj.com/MajorLogin","BD"),
          ]
          for label,url,region in variants:
              payload={"access_token":at,"open_id":oid,"region":region}
              h={"Content-Type":"application/json",
                 "User-Agent":"GarenaMSDK/4.0.39(SM-A525F;Android)",
                 "ReleaseVersion":"OB55","X-GA":"v1 1","X-Unity-Version":"2018.4.11f1"}
              for plabel, proxy in (("phone",px),("direct",None)):
                  try:
                      r=httpx.post(url, json=payload, headers=h, timeout=25, verify=False, proxy=proxy)
                      txt=r.text
                      jwt=bool(re.search(r"eyJ[A-Za-z0-9_\-]+\.eyJ", txt))
                      print(f"  {label:22} [{plabel}] HTTP {r.status_code} len={len(txt)} jwt={jwt} head={txt[:90]!r}", flush=True)
                  except Exception as e:
                      print(f"  {label:22} [{plabel}] {type(e).__name__}: {str(e)[:90]}", flush=True)
          PY
      - name: Run glory engine through phone proxy
        if: false
        env:
          BD_CREDS_B64: ${{ secrets.BD_CREDS_B64 }}
          PHONE_PROXY_IP: ${{ secrets.PHONE_PROXY_IP }}
        run: |
          [ -n "$BD_CREDS_B64" ] && echo "$BD_CREDS_B64" | base64 -d > bd_creds.txt || true
          export BD_PROXY_URL="socks5://$PHONE_PROXY_IP:1080"
          export PHONE_OK=1
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("level_config.json")
          cfg = json.loads(p.read_text()) if p.exists() else {}
          cfg.update({"enabled": True, "accounts": 1, "cycles": 1, "auto_mint": 0, "farm": True, "workers": 1})
          p.write_text(json.dumps(cfg, indent=1))
          print("test config ready")
          PY
          timeout 900 python3 -u -m levelbot.run_level --all 1 --cycles 1 2>&1 | tail -100
