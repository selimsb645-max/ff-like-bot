name: Glory Engine Test (phone proxy)
on:
  workflow_dispatch:
concurrency:
  group: glory-test
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r requirements.txt socksio
      - name: Join Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscaled > /tmp/tailscaled.log 2>&1 &
          sleep 5
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="ff-glory-test" --accept-routes --reset
      - name: Decode MajorLogin rejection payload
        env:
          PHONE_PROXY_IP: ${{ secrets.PHONE_PROXY_IP }}
        run: |
          export BD_PROXY_URL="socks5://$PHONE_PROXY_IP:1080"
          python3 - <<'PY'
          import os, json, httpx, binascii
          import ff_bd_api as api
          from levelbot import run_level as rl
          acc = json.load(open("guests_manager/registered_pool.json"))[0]
          pair = api.guest_grant(acc["uid"], acc["pw"])
          print("grant:", bool(pair), flush=True)
          if not pair: raise SystemExit
          at, oid = pair
          wire = rl._full_device_wire(oid, at, acc["uid"])
          r = httpx.post("https://loginbp.ggpolarbear.com/MajorLogin", data=api._enc(wire),
              headers={"User-Agent": rl.FULL_UAS[0], "X-GA-SV": "1789535859",
                       "Authorization": f"Bearer {at}", "X-GA": "v1 1",
                       "ReleaseVersion": "OB55", "Content-Type": "application/octet-stream",
                       "X-Unity-Version": "2018.4.12f1"}, timeout=25, verify=False)
          body = r.content
          print("status:", r.status_code, "len:", len(body), flush=True)
          print("hex:", binascii.hexlify(body).decode(), flush=True)
          print("headers:", dict(r.headers), flush=True)
          try:
              for f, t, v in api._walk_pb(body):
                  print("  field", f, t, (v[:60] if isinstance(v, bytes) else v), flush=True)
          except Exception as e:
              print("pb walk failed:", type(e).__name__, str(e)[:120], flush=True)
          # try treating body as utf-8 text
          print("text:", body.decode("latin-1")[:200], flush=True)
          # also: what does the engine's decode helper produce?
          try:
              from levelbot.xC4 import DecodE_HeX
              print("xC4 decode:", str(DecodE_HeX(binascii.hexlify(body).decode()))[:200], flush=True)
          except Exception as e:
              print("xC4 decode failed:", type(e).__name__, str(e)[:100], flush=True)
          PY
      - name: Run glory engine through phone proxy
        if: false
        env:
          BD_CREDS_B64: ${{ secrets.BD_CREDS_B64 }}
          PHONE_PROXY_IP: ${{ secrets.PHONE_PROXY_IP }}
        run: |
          [ -n "$BD_CREDS_B64" ] && echo "$BD_CREDS_B64" | base64 -d > bd_creds.txt || true
          export BD_PROXY_URL="socks5://$PHONE_PROXY_IP:1080"
          export PHONE_OK=1
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("level_config.json")
          cfg = json.loads(p.read_text()) if p.exists() else {}
          cfg.update({"enabled": True, "accounts": 1, "cycles": 1, "auto_mint": 0, "farm": True, "workers": 1})
          p.write_text(json.dumps(cfg, indent=1))
          print("test config ready")
          PY
          timeout 900 python3 -u -m levelbot.run_level --all 1 --cycles 1 2>&1 | tail -100
