name: Glory Engine Test (phone proxy)
on:
  workflow_dispatch:
concurrency:
  group: glory-test
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r requirements.txt socksio
      - name: Join Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscaled > /tmp/tailscaled.log 2>&1 &
          sleep 5
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="ff-glory-test" --accept-routes --reset
      - name: Guild member account: login + level + guild check
        env:
          PHONE_PROXY_IP: ${{ secrets.PHONE_PROXY_IP }}
          GUEST_CREDS_JSON: ${{ secrets.GUEST_CREDS_JSON }}
        run: |
          python3 - <<'PY'
          import os, json, httpx, time
          import ff_bd_api as api, ff_majorlogin as fm
          from levelbot import run_level as rl
          cred = json.loads(os.environ["GUEST_CREDS_JSON"])
          uid, pw = str(cred["uid"]), cred["pw"]
          print("uid:", uid, flush=True)
          pair = rl._grant_direct(uid, pw)
          print("grant:", bool(pair), flush=True)
          if not pair: raise SystemExit
          at, oid = pair
          # try modern major login BOTH direct and via phone, print every host result
          for label, proxy in (("direct", None), ("phone", "socks5://" + os.environ["PHONE_PROXY_IP"] + ":1080")):
              _post = httpx.post
              if proxy:
                  httpx.post = lambda *a, **kw: _post(*a, **{**kw, "proxy": proxy})
              else:
                  httpx.post = _post
              ml = fm.major_login(uid, oid, at)
              print(f"major_login[{label}]:", ("OK jwt=" + str(len(ml["jwt"]))) if ml else "None", flush=True)
              if ml:
                  print("  region:", ml.get("region"), "url:", str(ml.get("url"))[:45], flush=True)
                  lvl = rl.profile_level_exp(ml["jwt"], uid, ml.get("url"))
                  print("  level:", lvl, flush=True)
                  h = api._headers(ml["jwt"], "OB55")
                  for path in ("/GetClanInfoByClanID", "/GetClanMainPageInfo"):
                      try:
                          r = httpx.post("https://clientbp.ggpolarbear.com" + path, headers=h,
                                         data=api._enc(b"\x08" + api._pb_varint(3106233034)),
                                         timeout=18, verify=False)
                          txt = r.content.decode("latin-1")
                          print(f"  {path}: {r.status_code} len={len(r.content)} head={txt[:120]!r}", flush=True)
                      except Exception as e:
                          print(f"  {path}: {type(e).__name__} {str(e)[:60]}", flush=True)
                  break
              httpx.post = _post
          PY
      - name: Run glory engine through phone proxy
        if: false
        env:
          BD_CREDS_B64: ${{ secrets.BD_CREDS_B64 }}
          PHONE_PROXY_IP: ${{ secrets.PHONE_PROXY_IP }}
        run: |
          [ -n "$BD_CREDS_B64" ] && echo "$BD_CREDS_B64" | base64 -d > bd_creds.txt || true
          export BD_PROXY_URL="socks5://$PHONE_PROXY_IP:1080"
          export PHONE_OK=1
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("level_config.json")
          cfg = json.loads(p.read_text()) if p.exists() else {}
          cfg.update({"enabled": True, "accounts": 1, "cycles": 1, "auto_mint": 0, "farm": True, "workers": 1})
          p.write_text(json.dumps(cfg, indent=1))
          print("test config ready")
          PY
          timeout 900 python3 -u -m levelbot.run_level --all 1 --cycles 1 2>&1 | tail -100
