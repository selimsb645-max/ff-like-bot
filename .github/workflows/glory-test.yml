name: Glory Engine Test (phone proxy)
on:
  workflow_dispatch:
concurrency:
  group: glory-test
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r requirements.txt socksio
      - name: Join Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscaled > /tmp/tailscaled.log 2>&1 &
          sleep 5
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="ff-glory-test" --accept-routes --reset
      - name: Run matches on the guild-member account
        env:
          PHONE_PROXY_IP: ${{ secrets.PHONE_PROXY_IP }}
          GUEST_CREDS_JSON: ${{ secrets.GUEST_CREDS_JSON }}
        run: |
          python3 - <<'PY'
          import os, json, base64
          cred = json.loads(os.environ["GUEST_CREDS_JSON"])
          line = f'{cred["uid"]}:{cred["pw"]}'
          with open("/tmp/creds.env", "w") as f:
              f.write("BD_CREDS_B64=" + base64.b64encode(line.encode()).decode() + "\n")
          print("account:", cred["uid"], flush=True)
          PY
          set -a; . /tmp/creds.env; set +a
          # this account logs in DIRECT (verified), so no phone proxy is needed
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("level_config.json")
          cfg = json.loads(p.read_text())
          cfg.update({"enabled": True, "accounts": 1, "cycles": 4, "auto_mint": 0, "farm": True, "workers": 1})
          p.write_text(json.dumps(cfg, indent=1))
          print("config set", flush=True)
          PY
          timeout 1500 python3 -u -m levelbot.run_level --all 1 --cycles 4 2>&1 | tail -60
