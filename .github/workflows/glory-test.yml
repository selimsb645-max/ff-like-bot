name: Glory Engine Test (phone proxy)
on:
  workflow_dispatch:
concurrency:
  group: glory-test
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r requirements.txt socksio
      - name: Join Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscaled > /tmp/tailscaled.log 2>&1 &
          sleep 5
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="ff-glory-test" --accept-routes --reset
      - name: Guild apply path enumeration
        env:
          PHONE_PROXY_IP: ${{ secrets.PHONE_PROXY_IP }}
        run: |
          export BD_PROXY_URL="socks5://$PHONE_PROXY_IP:1080"
          python3 - <<'PY'
          import os, json, httpx
          import ff_bd_api as api
          from levelbot import run_level as rl
          pool = json.load(open("guests_manager/registered_pool.json"))
          pool.sort(key=lambda r: int(r["uid"]) if str(r["uid"]).isdigit() else 0, reverse=True)
          acc = pool[0]
          login = rl.raw_login(acc["uid"], acc["pw"])
          print("account", acc["uid"], "login", bool(login), flush=True)
          if not login: raise SystemExit
          body = api._enc(b"\x08" + api._pb_varint(3106233034))
          paths = ["/JoinClan","/ApplyClan","/ApplyGuild","/RequestJoinClan","/ApplyClanReq",
                   "/JoinClanReq","/ClanApply","/GuildApply","/ApplyinGuild","/JoinGuildReq",
                   "/Clan/Apply","/Guild/Join","/ApplyToClan","/ClanApplyReq"]
          for host in ("https://clientbp.ggpolarbear.com","https://clientbp.ppmainecoonghj.com"):
              for p in paths:
                  try:
                      h = api._headers(login["jwt"], "OB55")
                      r = httpx.post(host+p, headers=h, data=body, timeout=12, verify=False)
                      if r.status_code != 404:
                          txt = r.content.decode("latin-1")[:60]
                          print(f"  {host.split('//')[1]:32}{p:18} -> {r.status_code} {txt!r}", flush=True)
                  except Exception as e:
                      print(f"  {host.split('//')[1]:32}{p:18} -> {type(e).__name__}", flush=True)
          print("enumeration done (silent = 404)", flush=True)
          PY
      - name: Run glory engine through phone proxy
        if: false
        env:
          BD_CREDS_B64: ${{ secrets.BD_CREDS_B64 }}
          PHONE_PROXY_IP: ${{ secrets.PHONE_PROXY_IP }}
        run: |
          [ -n "$BD_CREDS_B64" ] && echo "$BD_CREDS_B64" | base64 -d > bd_creds.txt || true
          export BD_PROXY_URL="socks5://$PHONE_PROXY_IP:1080"
          export PHONE_OK=1
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("level_config.json")
          cfg = json.loads(p.read_text()) if p.exists() else {}
          cfg.update({"enabled": True, "accounts": 1, "cycles": 1, "auto_mint": 0, "farm": True, "workers": 1})
          p.write_text(json.dumps(cfg, indent=1))
          print("test config ready")
          PY
          timeout 900 python3 -u -m levelbot.run_level --all 1 --cycles 1 2>&1 | tail -100
