name: Glory Engine Test (phone proxy)
on:
  workflow_dispatch:
concurrency:
  group: glory-test
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r requirements.txt socksio
      - name: Join Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscaled > /tmp/tailscaled.log 2>&1 &
          sleep 5
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="ff-glory-test" --accept-routes --reset
      - name: Modern MajorLogin RAW debug
        env:
          PHONE_PROXY_IP: ${{ secrets.PHONE_PROXY_IP }}
        run: |
          python3 - <<'PY'
          import os, json, httpx, re
          px = "socks5://" + os.environ["PHONE_PROXY_IP"] + ":1080"
          import ff_bd_api as api, ff_majorlogin as fm
          acc = json.load(open("guests_manager/registered_pool.json"))[0]
          pair = api.guest_grant(acc["uid"], acc["pw"])
          print("grant:", bool(pair), flush=True)
          if not pair: raise SystemExit
          at, oid = pair
          try:
              ip = httpx.get("https://ipinfo.io/json", proxy=px, timeout=20).json().get("ip")
          except Exception:
              ip = "223.191.51.89"
          payload = fm.build_payload(acc["uid"], oid, at, ip)
          print("payload bytes:", len(payload), "| client_ip:", ip, flush=True)
          body = fm.encrypt(payload)
          for label, proxy in (("phone", px), ("direct", None)):
              try:
                  r = httpx.post(fm.ML_URL, data=body, headers=fm.HEADERS, timeout=25, verify=False, proxy=proxy)
                  raw = r.content
                  txt = raw.decode("latin-1")
                  strings = re.findall(r"[ -~]{6,}", txt)
                  print(f"[{label}] status={r.status_code} len={len(raw)} jwt={'eyJ' in txt}", flush=True)
                  print(f"  strings: {strings[:4]}", flush=True)
                  print(f"  fields: {[(f,wt) for f,wt,v in fm._walk(raw)][:8]}", flush=True)
              except Exception as e:
                  print(f"[{label}] {type(e).__name__}: {str(e)[:120]}", flush=True)
          PY
      - name: Run glory engine through phone proxy
        if: false
        env:
          BD_CREDS_B64: ${{ secrets.BD_CREDS_B64 }}
          PHONE_PROXY_IP: ${{ secrets.PHONE_PROXY_IP }}
        run: |
          [ -n "$BD_CREDS_B64" ] && echo "$BD_CREDS_B64" | base64 -d > bd_creds.txt || true
          export BD_PROXY_URL="socks5://$PHONE_PROXY_IP:1080"
          export PHONE_OK=1
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("level_config.json")
          cfg = json.loads(p.read_text()) if p.exists() else {}
          cfg.update({"enabled": True, "accounts": 1, "cycles": 1, "auto_mint": 0, "farm": True, "workers": 1})
          p.write_text(json.dumps(cfg, indent=1))
          print("test config ready")
          PY
          timeout 900 python3 -u -m levelbot.run_level --all 1 --cycles 1 2>&1 | tail -100
