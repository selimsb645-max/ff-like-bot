name: Mint Like Accounts (daily)

# Keeps the like pool stocked: registers fresh BD guest accounts so /like has
# working accounts to send from. Registration only - the login is left for the
# bot, because a guest account can be logged in exactly once.
#
# Garena stamps a guest's region from the IP that created it, so this job now
# goes out through the phone's BD IP (Tailscale + microsocks) instead of the
# runner's US datacenter IP. Without that, every minted account is useless.

on:
  schedule:
    - cron: "20 18 * * *"        # 00:20 Dhaka (UTC+6) daily
  workflow_dispatch:
    inputs:
      count:
        description: "accounts to add today"
        default: "300"
      gap:
        description: "seconds between registrations"
        default: "6"

concurrency:
  group: mint-likes
  cancel-in-progress: false

jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests "httpx[socks]" aiohttp aiohttp_socks pycryptodome protobuf \
                      protobuf-decoder google-play-scraper PyJWT pytz

      - name: Phone BD proxy (Tailscale)
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          PHONE_PROXY_IP: ${{ secrets.PHONE_PROXY_IP }}
          TS_HOSTNAME: ff-gh-mint
        run: bash ci/phone_proxy_setup.sh

      - name: Mint accounts into the like pool
        env:
          COUNT: ${{ github.event.inputs.count || '300' }}
          GAP: ${{ github.event.inputs.gap || '6' }}
          PHONE_PROXY_URL: ${{ env.PHONE_PROXY_URL }}
        run: |
          if [ -z "${PHONE_PROXY_URL:-}" ]; then
            echo "::error::কোনো BD প্রক্সি নেই — মিন্ট করছি না, কারণ US আইপি থেকে তৈরি অ্যাকাউন্ট BD প্লেয়ারকে লাইক দিতে পারে না"
            exit 1
          fi
          echo "proxy for mint: $PHONE_PROXY_URL"
          cd unfair_glory
          python mint_likes_pool.py --count "$COUNT" --gap "$GAP"

      - name: Commit pool
        if: always()
        run: |
          git config user.name "ff-like-bot"
          git config user.email "bot@users.noreply.github.com"
          git add phone_accounts.json unfair_glory/.mint_likes_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no new accounts this run"
          else
            git commit -m "like pool: auto-minted accounts $(date -u +%Y-%m-%d)"
            git push
          fi
