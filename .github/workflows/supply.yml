name: Owned Account Supply

# Keeps a pool of accounts WE created, instead of borrowing shared public tokens.
# A like only counts from an account that has been inside the game, so each new
# account is registered, logged in with the full-device payload, and walked into
# the game once. Everything leaves through the owner's phone (BD exit).

on:
  workflow_dispatch:
    inputs:
      ensure:
        description: Target number of live owned accounts
        default: '250'
      create_max:
        description: Max new accounts to create this run
        default: '40'
  schedule:
    - cron: '17 */3 * * *'

concurrency:
  group: ff-supply
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  supply:
    env:
      # Owner 2026-11-20: @NAI_AccessBot is unreachable (Base44 quota 402), so the
      # licence/device gate is off for our own runs. Remove this line to re-arm it.
      FF_SKIP_ACCESS: "1"
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt 'httpx[socks]' python-socks

      - name: Phone BD proxy (Tailscale)
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          PHONE_PROXY_IP: ${{ secrets.PHONE_PROXY_IP }}
          TS_HOSTNAME: ff-gh-bot
        run: bash ci/phone_proxy_setup.sh
      - name: Check the exit really is BD
        run: |
          if [ -z "$BD_PROXY_URL" ]; then echo "no phone proxy — aborting"; exit 1; fi
          python3 - <<'PY'
          import os, httpx, sys
          u = os.environ["BD_PROXY_URL"]
          try:
              j = httpx.get("https://ipinfo.io/json", proxy=u, timeout=25).json()
          except Exception as e:
              sys.exit(f"phone proxy unreachable: {str(e)[:120]}")
          print("exit:", j.get("ip"), j.get("city"), j.get("country"), j.get("org"))
          if j.get("country") != "BD":
              sys.exit("exit is not BD — refusing to create accounts")
          PY

      - name: Status before
        run: python3 supply.py --status

      - name: Renew and create
        env:
          GUEST_PW: ${{ secrets.GUEST_PW }}
          BOT_ACCESS_KEY: ${{ secrets.BOT_ACCESS_KEY }}
        run: |
          python3 supply.py --prune || true
          python3 supply.py --ensure "${{ github.event.inputs.ensure || '250' }}" \
                            --create-max "${{ github.event.inputs.create_max || '40' }}"

      - name: Status after
        if: always()
        run: python3 supply.py --status

      - name: Save the pool
        if: always()
        run: |
          if [ -f bd_pool_owned.json ]; then
            git config user.name "ff-supply"
            git config user.email "supply@users.noreply.github.com"
            git add bd_pool_owned.json phone_accounts.json 2>/dev/null || true
            git commit -m "supply: owned pool $(python3 -c "import json;print(len(json.load(open('bd_pool_owned.json'))))") accounts ($(date -u +%FT%TZ))" || echo "nothing to commit"
            git push || echo "push skipped"
          fi
